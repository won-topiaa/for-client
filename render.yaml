# Render.com 배포 설정 (Blueprint)
# 사용법: render.com -> New -> Blueprint -> 이 저장소/브랜치 선택
#
# 기본 공급자가 무료 시세(FinanceDataReader/Yahoo)라 API 키·IP 등록이 필요 없다.
# SITE_PASSWORD 만 선택적으로 설정(비공개용). 비워두면 누구나 접속 가능(공개).
services:
  - type: web
    name: ma-radar
    runtime: python
    plan: free
    rootDir: stock-ma-analyzer
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      # 선택: 접속 비밀번호(비공개용). 공개로 열려면 Render 대시보드에서 비워둠.
      - key: SITE_PASSWORD
        sync: false
